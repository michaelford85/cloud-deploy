---
- name: Send success email to requester
  hosts: localhost
  vars_files:
    - ./credentials/gmail_creds.yml
    - ./vars/default-vars.yml
    - ./credentials/aws_resources.yml

  tasks:

    - name: Download Private Key from S3
      amazon.aws.s3_object:
        bucket: "{{ aws_s3_bucket }}"
        object: "{{ aws_s3_project_name }}/snow-change-request.yml"
        dest: "/runner/snow-change-request.yml"
        mode: get
      register: download_result

    - name: Include Change Request artifact
      ansible.builtin.include_vars: "/runner/snow-change-request.yml"
      when: from_snow|bool

    - name: Sending an email requesting approval
      ansible.builtin.mail:
        host: smtp.gmail.com
        port: 587
        username: "{{ gmail_username }}"
        password: "{{ gmail_password }}"
        to:
        - "Michael Ford <{{ approver_email }}>"
        subject: "Change Request {{ snow_cr_number }} Successful"
        body: "Your ServiceNow Change Request {{ snow_cr_number }} has been completed successfully!"
      delegate_to: localhost
      when: from_snow|bool
