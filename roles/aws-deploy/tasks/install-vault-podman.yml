---
- block:
    
    - name: Check if the dev-vault container exists
      community.docker.docker_container_info:
        name: dev-vault
      register: vault_container_info
      failed_when: false

    - ansible.builtin.debug:
        var: vault_container_info

    - name: Run Vault container with specified configuration
      community.docker.docker_container:
        name: dev-vault
        image: "docker.io/hashicorp/vault:{{ vault_version }}"
        state: started
        detach: true
        published_ports:
          - "8200:8200"
        env:
          VAULT_DEV_ROOT_TOKEN_ID: "{{ vault_root_token }}"
        capabilities:
          - "IPC_LOCK"
      when: vault_container_info.exists == false
    
    - name: Wait for the Vault container to be available
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8200/v1/sys/health"
        method: GET
        return_content: yes
      register: vault_health
      retries: 20
      delay: 5
      until: vault_health.status == 200
  when: tags.group == "webserver"
