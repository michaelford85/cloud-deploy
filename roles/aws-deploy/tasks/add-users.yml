---

- name: Define temporary file paths
  ansible.builtin.set_fact:
    private_key_path: "/runner/{{ ec2_prefix }}-key-private.pem"
    public_key_path: "/runner/{{ ec2_prefix }}-key.pub"

- name: Copy private key to /runner directory
  amazon.aws.s3_object:
    bucket: "{{ aws_s3_bucket }}"
    object: "{{ aws_s3_project_name }}/{{ ec2_prefix }}-key-private.pem"
    dest: "{{ private_key_path }}"
    mode: get
  delegate_to: localhost
  run_once: yes

- name: Copy public key to /runner directory
  amazon.aws.s3_object:
    bucket: "{{ aws_s3_bucket }}"
    object: "{{ aws_s3_project_name }}/{{ ec2_prefix }}-key.pub"
    dest: "{{ public_key_path }}"
    mode: get
  delegate_to: localhost
  run_once: yes

- name: Slurp file contents for public key
  ansible.builtin.slurp:
    src: "{{ public_key_path }}"
  register: file_content
  delegate_to: localhost
  run_once: yes
  
- name: Decode file content
  set_fact:
    public_key_content_decoded: "{{ file_content['content'] | b64decode }}"
  delegate_to: localhost
  run_once: yes

- name: Create vault_hostname.yml template
  ansible.builtin.template:
    src: vault_hostname.j2
    dest: /runner/vault_hostname.yml
  delegate_to: localhost
  run_once: yes

- name: Include variable file for vault_hostname
  ansible.builtin.include_vars:
    file: /runner/vault_hostname.yml
  delegate_to: localhost
  run_once: yes

- name: Add key value pair secrets engine to vault
  ansible.builtin.uri:
    url: "http://{{ vault_hostname }}:8200/v1/sys/mounts/captains"
    method: POST
    body_format: json
    body:
      {
        "type": "kv"
      }
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200, 204
  run_once: yes

- name: Create linux_users.json template
  ansible.builtin.template:
    src: linux_users.j2
    dest: /runner/linux_users.json
  delegate_to: localhost
  run_once: yes

- name: Add user ssh keys to secrets engine
  ansible.builtin.uri:
    url: "http://{{ vault_hostname }}:8200/v1/captains/users"
    method: POST
    src: /runner/linux_users.json
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200, 204
  delegate_to: localhost
  run_once: yes

- name: Delete linux_users.json
  ansible.builtin.file:
    path: /runner/linux_users.json
    state: absent
  delegate_to: localhost
  run_once: yes

- name: Delete vault_hostname.yml
  ansible.builtin.file:
    path: /runner/vault_hostname.yml
    state: absent
  delegate_to: localhost
  run_once: yes

- block:
  #Create users and force them to change password upon first login
  #https://lebenplusplus.de/2017/04/19/creating-users-and-their-passwords-with-ansible/
  - name: Add users
    ansible.builtin.user:
      name: "{{ item.username }}"
      groups: wheel
    with_items: "{{ linux_users }}"
    become: yes

  - name: Add public ssh key to user
    ansible.posix.authorized_key:
      user: "{{ item.username }}"
      state: present
      key: "{{ public_key_content_decoded }}"
    with_items: "{{ linux_users }}"
    become: yes

  - name: Unlock password and set it to empty
    ansible.builtin.command: "passwd -d {{ item.username }}"
    with_items: "{{ linux_users }}"
    become: yes

  - name: Expire password
    ansible.builtin.command: "chage -d 0 {{ item.username }}"
    with_items: "{{ linux_users }}"
    become: yes

  - name: Allow newly added users to sudo without a password
    ansible.builtin.template:
      src: sudoers.j2
      dest: /etc/sudoers.d/sudoers
      validate: 'visudo -cf %s'
      mode: 0440
    become: yes

  #Instructions on how to change SSH PasswordAuthentication
  #https://www.reddit.com/r/ansible/comments/8v943t/add_a_ansible_task_to_allow/
  - name: update sshd config to allow for Password Authentication
    ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: '^PasswordAuthentication.*no'
      line: 'PasswordAuthentication yes'
    notify: restart_sshd
    become: yes
  when: tags.group == "rhel"
